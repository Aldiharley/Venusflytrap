[package]
name = "vft-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Venusflytrap core engine: normalize -> token-graph taint -> four-valued lattice -> verdict, plus honeypot and attack-chain inference."

[features]
# Derive ts_rs::TS on wire types; `cargo test -p vft-core --features ts` checks ui/src/gen.
ts = ["dep:ts-rs"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
unicode-normalization.workspace = true
base64.workspace = true
regex.workspace = true
thiserror.workspace = true
ts-rs = { version = "12.0.1", optional = true }

[dev-dependencies]
proptest = "1.5.0"
