[package]
name = "vft-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Venusflytrap service runtime: supervisor, status, metrics, admin and history."

[dependencies]
vft-core = { path = "../vft-core" }
vft-proxy = { path = "../vft-proxy" }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
thiserror.workspace = true
hyper = { version = "1.5.0", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.10", features = ["tokio", "server", "client", "client-legacy", "http1"] }
http-body-util = "0.1.2"
tokio = { version = "1.41.0", features = ["rt-multi-thread", "net", "macros", "sync", "io-util", "time", "signal"] }
bytes = "1.8.0"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }

[dev-dependencies]
tokio = { version = "1.41.0", features = ["rt-multi-thread", "net", "macros", "sync", "io-util", "time", "test-util"] }
