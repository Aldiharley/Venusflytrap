# Stand-in upstream for the DQ4 baselines: answers every request with an empty 200.
# It runs the nginx binary of the ModSecurity image without loading the ModSecurity
# module, so nothing here inspects traffic. nginx discards (reads and drops) the
# request body before it finishes a `return`.
worker_processes 2;
pid /tmp/upstream.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    access_log off;
    client_max_body_size 0;
    # Accept any request line or header the WAF in front passed on: nginx's default
    # 8 KiB buffers would answer 414/400 for long URIs that a WAF let through.
    client_header_buffer_size 64k;
    large_client_header_buffers 8 1m;
    keepalive_requests 100000;
    keepalive_timeout 60s;

    server {
        listen 8080 default_server;
        location / {
            return 200 "";
        }
    }
}
