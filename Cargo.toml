[workspace]
resolver = "2"
members = ["crates/vft-core", "crates/vft-cli", "crates/vft-proxy"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Aldiharley/venusflytrap"
authors = ["Dennis Liu"]

[workspace.dependencies]
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
serde_yaml = "0.9.34"
percent-encoding = "2.3.1"
unicode-normalization = "0.1.24"
base64 = "0.22.1"
regex = "1.11.1"
anyhow = "1.0.89"
thiserror = "1.0.64"
clap = { version = "4.5.20", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
